[package]
name = "quantcandle"
version = "0.1.0"
edition = "2021"
description = "Candle-framework port of torchquantlib pricing models, mirroring quantburn"

[dependencies]
candle-core = { version = "0.9", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
mkl = ["candle-core/mkl"]

[[bin]]
name = "crosscheck"
path = "src/bin/crosscheck.rs"
